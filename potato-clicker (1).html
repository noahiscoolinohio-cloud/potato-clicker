<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potato Clicker</title>
<style>
  :root {
    --kraft: #ddd4bf;
    --wood: #6b4226;
    --wood-dark: #392919;
    --ink: #8d4943;
    --ink-dark: #6a3733;
    --charcoal: #2b2016;
    --cream: #f5f1e6;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #34304f 0%, #6d5470 30%, #c4877a 58%, #dcb88c 75%, #eadcb8 100%) fixed;
    color: var(--charcoal);
    font-family: 'Comic Sans MS', 'Comic Sans', cursive;
    display: flex;
    justify-content: center;
    padding: 28px 14px;
    transition: padding-right 0.3s ease;
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  button:focus-visible, .node:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 460px; position: relative; z-index: 2; }

  .drifters { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .drifter { position: absolute; bottom: -60px; opacity: 0.35; animation: drift linear infinite; }
  @keyframes drift {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-115vh) rotate(360deg); }
  }

  .crate-sign {
    background: var(--wood);
    border: 4px solid var(--wood-dark);
    border-radius: 3px;
    padding: 16px 20px;
    text-align: center;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
    margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 2rem; color: var(--cream); text-shadow: 2px 2px 0 var(--wood-dark); }
  .slate {
    background: var(--charcoal);
    color: var(--cream);
    border: 6px solid var(--wood-dark);
    border-radius: 3px;
    padding: 14px 18px;
    text-align: center;
    margin-bottom: 22px;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
  }
  .slate .count { font-size: 2.2rem; font-weight: bold; }
  .slate .unit { font-size: 0.8rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 2px; }
  .slate .rate { font-size: 0.85rem; margin-top: 8px; color: #c3b081; }
  .click-area { display: flex; justify-content: center; }
  .potato-disc {
    background: #cbb583;
    border: 6px dashed var(--ink);
    border-radius: 50%;
    width: 190px;
    height: 190px;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease;
  }
  #potato-btn:hover { background-color: #d9c69a; }
  #potato-btn:active { transform: scale(0.9); }
  .potato-wrap { position: relative; display: block; width: 150px; height: 150px; pointer-events: none; }
  .potato-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  .potato-svg.rainbow { animation: hue 4s linear infinite; }
  @keyframes hue {
    from { filter: hue-rotate(0deg) saturate(1.15); }
    to { filter: hue-rotate(360deg) saturate(1.15); }
  }
  .potato-disc.ring-wood { border: 6px solid var(--wood-dark); box-shadow: inset 0 0 0 5px var(--wood); }
  .potato-disc.ring-blue { border: 6px dotted #3c6ea6; }
  .potato-disc.ring-green { border: 6px dashed #55713c; }
  .potato-disc.ring-gold { border: 6px solid #ad9159; box-shadow: 0 0 18px #d6bb84; }
  .potato-disc.ring-neon { border: 6px solid #e495ce; box-shadow: 0 0 14px #e495ce, inset 0 0 12px rgba(206,150,190,0.5); }
  .potato-disc.ring-rainbow {
    border: 6px solid transparent;
    background: linear-gradient(#cbb583, #cbb583) padding-box, conic-gradient(#c5685e, #c4a93c, #4eac76, #5591ba, #9b59b6, #c5685e) border-box;
  }
  .spark { position: fixed; pointer-events: none; z-index: 59; font-size: 20px; animation: spark 0.7s ease-out forwards; }
  @keyframes spark {
    from { opacity: 1; transform: translate(0, 0) scale(1); }
    to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.6); }
  }

  .float-pop {
    position: fixed; pointer-events: none; font-weight: bold;
    color: var(--ink-dark); font-size: 1.1rem; z-index: 60;
    text-shadow: 1px 1px 0 var(--cream);
    animation: floatUp 0.8s ease-out forwards;
  }
  .float-pop.crit { color: var(--ink); font-size: 1.5rem; }
  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-50px); }
  }

  .golden-potato {
    position: fixed; font-size: 48px; cursor: pointer; z-index: 50;
    filter: drop-shadow(0 0 10px #dbc26e);
    animation: bob 1.4s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .notes {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 90; pointer-events: none; width: max-content; max-width: 92vw;
  }
  .note {
    background: var(--cream); border: 2px solid var(--ink); border-radius: 3px;
    padding: 8px 16px; font-size: 0.9rem;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
  }
  .note.gold { background: #ece1bf; border-color: #ad9159; }
  .note.ach { border-color: #ad9159; background: #f7f2de; }

  .slate.frenzy { border-color: #ad9159; box-shadow: 0 0 0 4px #d6bb84, 5px 5px 0 rgba(0,0,0,0.2); }
  .slate .frenzy-line { color: #d6bb84; font-weight: bold; font-size: 0.9rem; margin-top: 8px; min-height: 1.2em; }

  .drawer {
    position: fixed; top: 0; right: 0;
    height: 100vh; width: min(640px, 100vw);
    background: var(--kraft);
    border-left: 4px solid var(--wood-dark);
    box-shadow: -6px 0 0 rgba(0,0,0,0.22);
    z-index: 30;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }
  .drawer.open { transform: translateX(0); }
  @media (min-width: 1020px) { body.drawer-open { padding-right: 660px; } }

  .handles {
    position: absolute; left: -48px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .drawer-handle {
    position: relative;
    width: 44px; padding: 16px 0;
    background: var(--wood);
    background-image: repeating-linear-gradient(90deg, var(--wood) 0px, var(--wood) 14px, #5a341f 15px, var(--wood) 16px);
    color: var(--cream);
    border: 4px solid var(--wood-dark); border-right: none;
    border-radius: 6px 0 0 6px;
    cursor: pointer;
    writing-mode: vertical-rl;
    font-size: 0.95rem; font-weight: bold;
    box-shadow: -3px 3px 0 rgba(0,0,0,0.22);
    text-shadow: 2px 2px 0 var(--wood-dark);
  }
  .drawer-handle.active { background: var(--cream); color: var(--charcoal); text-shadow: none; }
  .panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .panel.hidden { display: none; }
  .drawer-handle:hover:not(.active) { background-color: #7c4e2e; }
  .badge {
    position: absolute; top: -10px; left: -10px;
    min-width: 24px; height: 24px; padding: 0 6px;
    background: var(--ink); color: var(--cream);
    border: 2px solid var(--cream); border-radius: 12px;
    font-size: 0.75rem; line-height: 20px; text-align: center;
    writing-mode: horizontal-tb; text-shadow: none;
  }
  .badge.hidden { display: none; }

  .map-view {
    position: relative; flex: 1; overflow: hidden;
    touch-action: none; cursor: grab;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px);
  }
  .map-view.dragging { cursor: grabbing; }
  .map { position: absolute; left: 0; top: 0; will-change: transform; }
  .map-lines { position: absolute; left: 0; top: 0; pointer-events: none; }
  .map-lines line { stroke-width: 5; display: none; }
  .map-lines line.open { stroke: #ad9159; stroke-dasharray: 9 7; display: inline; }
  .map-lines line.done { stroke: #55713c; display: inline; }

  .map-ui { position: absolute; z-index: 5; }
  .map-counter {
    top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    background: var(--charcoal); color: var(--cream);
    border: 4px solid var(--wood-dark); border-radius: 3px;
    padding: 6px 12px;
    font-size: 1.15rem; font-weight: bold;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.22);
    pointer-events: none;
  }
  .map-counter .c-icon { font-size: 1.4rem; line-height: 1; }
  .map-btns { top: 14px; right: 14px; display: flex; gap: 8px; }
  .px-btn {
    width: 40px; height: 40px;
    background: var(--cream); color: var(--charcoal);
    border: 3px solid var(--wood-dark); border-radius: 3px;
    font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.22);
  }
  .px-btn:hover { background: #e9e3d3; }
  .px-btn.close { background: var(--ink); color: var(--cream); }
  .px-btn.close:hover { background: var(--ink-dark); }

  .node {
    position: absolute; width: 64px; height: 64px;
    background: var(--cream);
    border: 4px solid var(--wood-dark);
    border-radius: 3px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.22);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2;
  }
  .node .sprite { font-size: 34px; line-height: 1; pointer-events: none; }
  .node .eff {
    position: absolute; right: -9px; bottom: -9px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--wood-dark); color: var(--cream);
    border: 2px solid var(--cream);
    font-size: 0.78rem; font-weight: bold; line-height: 16px; text-align: center;
    pointer-events: none;
  }
  .node.ready  { border: 4px dashed var(--ink); background: #f7f2de; }
  .node.ready:hover { background: #efe6c0; }
  .node.poor   { background: var(--cream); border-color: var(--wood); }
  .node.poor .sprite { opacity: 0.6; }
  .node.owned  { background: #dfe9cc; border-color: #55713c; }
  .node.owned .eff { background: #55713c; }
  .node.locked { background: #cdbb92; border-color: #8a7348; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); }
  .node.locked .sprite { opacity: 0.45; filter: grayscale(1); }
  .node.locked .eff { display: none; }
  .node.final.ready, .node.final.poor { background: #ece1bf; border-color: #ad9159; }
  .node.final.ready { border-style: dashed; border-color: var(--ink); }
  .node.selected { outline: 3px solid var(--charcoal); outline-offset: 4px; }

  .drawer-foot {
    background: var(--charcoal);
    border-top: 4px solid var(--wood-dark);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 116px;
    color: var(--cream);
  }
  .foot-name { color: #d6bb84; font-size: 1.05rem; font-weight: bold; }
  .foot-flavor { font-size: 0.85rem; font-style: italic; margin-top: 3px; color: #ddd4bf; }
  .foot-effect { font-size: 0.85rem; margin-top: 4px; opacity: 0.9; }
  .foot-req { font-size: 0.8rem; margin-top: 4px; color: #c3b081; }
  #research-btn {
    flex-shrink: 0;
    background: var(--ink); color: var(--cream);
    border: 2px solid var(--cream); border-radius: 3px;
    padding: 10px 16px; font-size: 0.9rem; cursor: pointer;
  }
  #research-btn:hover:not(:disabled) { background: var(--ink-dark); }
  #research-btn:disabled { background: #4a3b2c; color: #9a8a74; border-color: #6b5a44; cursor: not-allowed; }

  .ach-head {
    background: var(--charcoal); color: var(--cream);
    border-bottom: 4px solid var(--wood-dark);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .ach-head h2 { margin: 0; font-size: 1.2rem; color: #d6bb84; }
  .ach-head .sub { font-size: 0.8rem; opacity: 0.85; margin-top: 3px; }
  .ach-body {
    flex: 1; overflow-y: auto; padding: 14px;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px);
  }
  .ward-head {
    background: var(--charcoal); color: var(--cream);
    border-bottom: 4px solid var(--wood-dark);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .ward-head h2 { margin: 0; font-size: 1.2rem; color: #d6bb84; }
  .ward-head .sub { font-size: 0.8rem; opacity: 0.85; margin-top: 3px; }
  .ward-head .px-btn { margin-left: auto; flex-shrink: 0; }
  .ward-preview { width: 100px; height: 100px; flex-shrink: 0; }
  .ward-preview .potato-disc { transform: scale(0.52); transform-origin: top left; cursor: default; }
  .ward-body {
    flex: 1; overflow-y: auto; padding: 14px;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px);
  }
  .ward-slot h3 {
    margin: 2px 0 8px; font-size: 1rem; color: var(--ink-dark);
    border-bottom: 2px solid var(--wood-dark); padding-bottom: 3px;
  }
  .ward-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .cos {
    background: var(--cream); color: var(--charcoal);
    border: 3px solid var(--wood-dark); border-radius: 3px;
    padding: 6px 4px 7px; text-align: center; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.18); font-family: inherit;
  }
  .cos:hover:not(.locked) { background: #f7f2de; }
  .cos .c-icon { display: block; font-size: 1.8rem; line-height: 1.25; }
  .cos .mini { display: block; width: 58px; height: 58px; margin: 0 auto; }
  .cos .mini .potato-wrap { width: 58px; height: 58px; }
  .cos.locked .mini { opacity: 0.45; filter: grayscale(1); }
  .cos .c-name { display: block; font-size: 0.74rem; font-weight: bold; margin-top: 2px; }
  .cos .c-hint { display: block; font-size: 0.64rem; color: var(--wood-dark); margin-top: 2px; }
  .cos.equipped { background: #f7f2de; border: 3px dashed var(--ink); }
  .cos.locked { background: #cdbb92; border-color: #8a7348; cursor: not-allowed; box-shadow: none; }
  .cos.locked .c-icon { opacity: 0.45; filter: grayscale(1); }
  .ach-card .a-reward { font-size: 0.74rem; color: var(--ink-dark); margin-top: 3px; }
  .ach-card {
    display: flex; align-items: center; gap: 12px;
    background: #f7f2de; border: 3px solid #ad9159; border-radius: 3px;
    padding: 8px 12px; margin-bottom: 10px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
  }
  .ach-card .a-icon { font-size: 1.9rem; width: 42px; text-align: center; line-height: 1; }
  .ach-card .a-name { font-weight: bold; }
  .ach-card .a-desc { font-size: 0.8rem; color: var(--wood-dark); margin-top: 2px; }
  .ach-card.locked { background: #cdbb92; border-color: #8a7348; box-shadow: 2px 2px 0 rgba(0,0,0,0.12); }
  .ach-card.locked .a-icon { opacity: 0.45; filter: grayscale(1); }
  .ach-card.locked .a-name { color: #5b4a2c; }

  .ending-overlay {
    position: fixed; inset: 0; background: rgba(43,32,22,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .sound-btn {
    position: fixed; left: 14px; bottom: 14px; z-index: 25;
    width: 44px; height: 44px; font-size: 1.3rem;
    background: var(--cream); border: 3px solid var(--wood-dark); border-radius: 3px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.22); cursor: pointer;
  }
  .sound-btn:hover { background: #e9e3d3; }
  .stats-body {
    flex: 1; overflow-y: auto; padding: 14px;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px),
      repeating-linear-gradient(-45deg, rgba(67,41,15,0.05) 0px, rgba(67,41,15,0.05) 1px, transparent 1px, transparent 7px);
  }
  .stat-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 4px; border-bottom: 1px dashed var(--wood); font-size: 0.9rem; }
  .stat-row span:last-child { font-weight: bold; color: var(--ink-dark); text-align: right; }
  .box {
    background: var(--cream); border: 3px solid var(--wood-dark); border-radius: 3px;
    padding: 12px; margin-top: 16px; box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
  }
  .box h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--ink-dark); }
  .box p { margin: 0 0 10px; font-size: 0.85rem; }
  .big-btn {
    background: var(--ink); color: var(--cream);
    border: 2px solid var(--wood-dark); border-radius: 3px;
    padding: 9px 14px; font-size: 0.9rem; cursor: pointer;
  }
  .big-btn:hover:not(:disabled) { background: var(--ink-dark); }
  .big-btn:disabled { background: #4a3b2c; color: #9a8a74; border-color: #6b5a44; cursor: not-allowed; }
  .big-btn.alt { background: var(--cream); color: var(--charcoal); }
  .big-btn.alt:hover:not(:disabled) { background: #e9e3d3; }
  .ending-box .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .ending-box .row button { margin-top: 0; }
  .ending-box button.alt { background: var(--cream); color: var(--charcoal); }
  .ending-box button.alt:hover { background: #e9e3d3; }
  @media (max-height: 600px) {
    .drawer-handle { padding: 10px 0; font-size: 0.85rem; }
    .handles { gap: 6px; }
  }
  .ending-box {
    background: var(--cream); border: 5px solid var(--wood-dark); border-radius: 4px;
    padding: 28px 24px; max-width: 420px; text-align: center;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
  }
  .ending-potato { font-size: 64px; line-height: 1.1; }
  .ending-box h2 { margin: 8px 0; font-size: 1.8rem; color: var(--ink-dark); }
  .ending-box p { font-size: 0.92rem; margin: 8px 0; }
  .ending-box button {
    margin-top: 12px; background: var(--ink); color: var(--cream);
    border: 2px solid var(--wood-dark); border-radius: 3px; padding: 8px 18px; cursor: pointer;
  }
  .ending-box button:hover { background: var(--ink-dark); }
</style>
</head>
<body>
<div class="drifters" id="drifters"></div>
<div class="notes" id="notes"></div>
<button class="sound-btn" id="sound-btn" aria-label="Turn sound on or off">🔊</button>

<div class="wrap">
  <div class="crate-sign"><h1>🥔 Potato Clicker</h1></div>

  <div class="slate" id="slate">
    <div class="count" id="potato-count">0</div>
    <div class="unit">potatoes</div>
    <div class="rate" id="rate-display">+0 per click · +0 per second</div>
    <div class="frenzy-line" id="frenzy-line"></div>
  </div>

  <div class="click-area">
    <button id="potato-btn" class="potato-disc" aria-label="Click to harvest a potato"></button>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Upgrades and achievements">
  <div class="handles">
    <button class="drawer-handle" id="drawer-handle" aria-expanded="false">
      Upgrades
      <span class="badge hidden" id="ready-badge">0</span>
    </button>
    <button class="drawer-handle" id="ach-handle" aria-expanded="false">
      Achievements
      <span class="badge hidden" id="ach-badge">0</span>
    </button>
    <button class="drawer-handle" id="ward-handle" aria-expanded="false">
      Wardrobe
      <span class="badge hidden" id="ward-badge">0</span>
    </button>
    <button class="drawer-handle" id="stats-handle" aria-expanded="false">Stats</button>
  </div>

  <div class="panel" id="panel-upgrades">
    <div class="map-view" id="map-view">
      <div class="map" id="map"></div>
      <div class="map-ui map-counter"><span class="c-icon">🥔</span><span id="counter-num">0</span></div>
      <div class="map-ui map-btns">
        <button class="px-btn" id="home-btn" aria-label="Recenter map">🏠</button>
        <button class="px-btn close" id="close-btn" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="drawer-foot">
      <div>
        <div class="foot-name" id="foot-name">Tap a square</div>
        <div class="foot-flavor" id="foot-flavor"></div>

  }
  function tone(freq, dur, type, vol, delay, slideTo) {

    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }
  const sfx = {
    click: () => tone(300 + Math.random() * 90, 0.08, 'triangle', 0.05),
    big: () => { tone(170, 0.2, 'square', 0.04, 0, 70); tone(520, 0.12, 'triangle', 0.05, 0.02); },

  const ENDING_COST = 30000000000000;
  const upgradeDefs = [];
  function nice(n) {
    if (n < 100) return Math.round(n);
    const p = Math.pow(10, Math.floor(Math.log10(n)) - 1);
    return Math.round(n / p) * p;
  }
  function describe(type, power) {
    switch (type) {
      case 'click': return '+' + formatNum(power) + ' per click';
      case 'auto': return '+' + formatNum(power) + ' per second';
      case 'mult': return 'Everything you make goes up ' + Math.round((power - 1) * 100) + '%';

  function formatNum(n) {
    if (n < 1000) return Math.floor(n).toString();
    const units = ['K','M','B','T','Qa','Qi'];

    while (val >= 1000 && unitIndex < units.length - 1) { val /= 1000; unitIndex++; }

  }

        case 'clickps': cps += d.power; break;

        case 'auto': auto += d.power; break;
        case 'mult': mult *= d.power; break;
        case 'crit': crit += d.power; break;
        case 'goldfreq': gd *= d.power; break;
        case 'goldbonus': gb += d.power; break;
        case 'discount': disc *= d.power; break;

    });

    if (mapW + m * 2 <= vw) view.x = (vw - mapW) / 2;

    if (mapH + m * 2 <= vh) view.y = (vh - mapH) / 2;

      ['Seeds planted', state.seeds + (state.seeds ? ' (+' + state.seeds * 10 + '%)' : '')],
      ['Times replanted', state.replants.toLocaleString()],
      ['Time played', clock(state.playSeconds)]
    ];
    statsListEl.innerHTML = rows.map(r => '<div class="stat-row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('');
    el('stats-sub').textContent = 'Everything you\u2019ve done so far.';

    const won = !!state.owned.greatpotato;
    const gain = seedGain();
    if (won) {
      replantText.textContent = 'Replanting gives you ' + gain + ' seed' + (gain === 1 ? '' : 's') + ', worth +' + gain * 10 + '% on everything forever. Your potatoes and upgrades start over. You keep your achievements, cosmetics, and seeds. The more you dig up before replanting, the more seeds you get.';
    } else {
      replantText.textContent = 'Buy The Great Potato first. After that you can replant: your potatoes and upgrades start over, but you keep your achievements and cosmetics, and each seed you earn adds 10% to everything forever.';
    }
    replantBtn.disabled = !won;
    replantBtn.textContent = won ? 'Replant for ' + gain + ' seed' + (gain === 1 ? '' : 's') : 'Replant';
    el('save-info').textContent = storageOK
      ? 'Your game saves itself in this browser every few seconds and whenever you leave. There\u2019s nothing to copy or paste.'
      : 'Saving doesn\u2019t work in this window, so your progress will be lost when you close it. Open the file in your own browser to keep your game.';
    el('sound-setting').textContent = state.soundOn ? '🔊 Sound is on' : '🔇 Sound is off';
  }

  function updateSoundUI() {
    el('sound-btn').textContent = state.soundOn ? '🔊' : '🔇';
    el('sound-setting').textContent = state.soundOn ? '🔊 Sound is on' : '🔇 Sound is off';
  }
  function toggleSound() {
    state.soundOn = !state.soundOn;
    updateSoundUI();
    if (state.soundOn) sfx.equip();
    saveGame();
  }
  el('sound-btn').addEventListener('click', toggleSound);
  el('sound-setting').addEventListener('click', toggleSound);

  function confirmBox(text, yesLabel, onYes) {
    const overlay = document.createElement('div');
    overlay.className = 'ending-overlay';
    overlay.innerHTML = '<div class="ending-box"><p></p><div class="row"><button id="yes-btn"></button><button class="alt" id="no-btn">Not yet</button></div></div>';
    overlay.querySelector('p').textContent = text;
    overlay.querySelector('#yes-btn').textContent = yesLabel;
    document.body.appendChild(overlay);
    overlay.querySelector('#yes-btn').addEventListener('click', () => { overlay.remove(); onYes(); });
    overlay.querySelector('#no-btn').addEventListener('click', () => overlay.remove());
  }

  function replant() {
    const gain = seedGain();
    state.seeds += gain;
    state.replants++;
    state.potatoes = 0;
    state.runEarned = 0;
    state.owned = {};
    state.selected = null;
    state.frenzyUntil = 0;
    state.frenzyClicks = 0;
    state.ended = false;
    recalc();
    render();
    sfx.replant();
    notify('Replanted! You now have ' + state.seeds + ' seed' + (state.seeds === 1 ? '' : 's') + ' (+' + state.seeds * 10 + '% on everything).', 'gold');
    saveGame();
  }
  replantBtn.addEventListener('click', () => {
    if (!state.owned.greatpotato) return;
    const gain = seedGain();
    confirmBox('Replant the farm for ' + gain + ' seed' + (gain === 1 ? '' : 's') + '? Your potatoes and upgrades start over. Achievements, cosmetics and seeds stay.', 'Replant', replant);
  });

  function showEnding() {
    state.ended = true;
    sfx.win();
    const gain = seedGain();
    const overlay = document.createElement('div');
    overlay.className = 'ending-overlay';
    overlay.innerHTML = `
      <div class="ending-box">
        <div class="ending-potato">👑🥔</div>
        <h2>That\u2019s a lot of potatoes.</h2>
        <p>The Great Potato is yours. Every field, truck, and moon patch is working for you now.</p>
        <p>You\u2019ve still got ${formatNum(state.potatoes)} in the bank. Keep digging, or replant the farm for ${gain} seed${gain === 1 ? '' : 's'} (+${gain * 10}% on everything, forever).</p>
        <div class="row">
          <button id="replant-now">Replant the farm</button>
          <button class="alt" id="keep-playing">Keep digging</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#keep-playing').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#replant-now').addEventListener('click', () => { overlay.remove(); replant(); });
  }

  function spawnFloatText(x, y, amount, crit) {
    const f = document.createElement('div');
    f.className = 'float-pop' + (crit ? ' crit' : '');
    f.textContent = (crit ? 'Big dig! +' : '+') + formatNum(amount);
    f.style.left = (x - 10) + 'px';
    f.style.top = (y - 20) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 800);
  }

  btn.addEventListener('click', (e) => {
    state.totalClicks++;
    const isCrit = Math.random() < state.crit;
    if (isCrit) state.bigDigs++;
    if (frenzyActive()) {
      state.frenzyClicks++;
      state.bestFrenzyClicks = Math.max(state.bestFrenzyClicks, state.frenzyClicks);
    }
    const gain = state.perClick * frenzyMult() * (isCrit ? 5 : 1);
    if (isCrit) sfx.big(); else sfx.click();
    addPotatoes(gain);
    spawnFloatText(e.clientX, e.clientY, gain, isCrit);
    burst(e.clientX, e.clientY);
    render();
  });

  let ticks = 0;
  setInterval(() => {
    state.playSeconds++;
    if (state.perSecond > 0) {
      addPotatoes(state.perSecond * frenzyMult());
      render();
    }
    if (drawerOpen() && currentView === 'stats') renderStats();
    ticks++;
    if (ticks % 10 === 0) saveGame();
  }, 1000);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

  let frenzyWasOn = false;
  setInterval(() => {
    const on = frenzyActive();
    if (on) updateFrenzyUI();
    if (on !== frenzyWasOn) { frenzyWasOn = on; if (!on) sfx.frenzyEnd(); render(); }
  }, 250);

  function spawnGoldenPotato() {
    const gp = document.createElement('div');
    gp.className = 'golden-potato';
    gp.textContent = '🥔';
    gp.style.left = (Math.random() * (window.innerWidth - 80) + 10) + 'px';
    gp.style.top = (Math.random() * (window.innerHeight - 160) + 80) + 'px';
    document.body.appendChild(gp);
    sfx.goldenAppear();

    const fadeTimer = setTimeout(() => {
      gp.remove();
      scheduleGoldenPotato(0);
    }, 8000);
    gp.addEventListener('click', () => {
      clearTimeout(fadeTimer);
      gp.remove();
      state.goldenCaught++;
      sfx.golden();
      const seconds = FRENZY_SECONDS + state.goldBonus;
      state.frenzyClicks = 0;
      state.frenzyUntil = Date.now() + seconds * 1000;
      notify('Golden potato! Everything is x' + FRENZY_MULT + ' for ' + seconds + ' seconds.', 'gold');
      frenzyWasOn = true;
      scheduleGoldenPotato(seconds * 1000);
      render();
    });
  }
  function scheduleGoldenPotato(waitMs) {
    setTimeout(spawnGoldenPotato, waitMs + (30000 + Math.random() * 30000) * state.goldDelay);
  }

  const drifters = el('drifters');
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('div');
    d.className = 'drifter';
    d.textContent = '🥔';
    d.style.left = (Math.random() * 100) + '%';
    d.style.fontSize = (22 + Math.random() * 36) + 'px';
    d.style.animationDuration = (22 + Math.random() * 26) + 's';
    d.style.animationDelay = (-Math.random() * 40) + 's';
    drifters.appendChild(d);
  }

  buildMap();
  const stored = loadStored();
  if (stored) {
    try {
      applySave(stored);
      recalc();
      welcomeBack(stored.savedAt);
    } catch (e) {}
  }
  applyPotato();
  renderAch();
  recalc();
  render();
  updateSoundUI();
  scheduleGoldenPotato(0);
})();
</script>
</body>
</html>
